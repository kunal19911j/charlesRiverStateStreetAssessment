plugins {
    id 'java'
    id 'idea'
}

group = 'assessment'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.16'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    
    // Pass system property if provided on CLI, e.g. -Drebalancing.adapter=...
    if (project.hasProperty('rebalancing.adapter')) {
        systemProperty 'rebalancing.adapter', project.property('rebalancing.adapter')
    }
    System.getProperties().each { key, value ->
        if (key.toString().startsWith('rebalancing.')) {
            systemProperty key.toString(), value.toString()
        }
    }
    
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

// Dedicated Smoke Test suite (runs only High priority tests)
tasks.register('smokeTest', Test) {
    description = 'Runs high-priority smoke/sanity test cases.'
    group = 'verification'
    
    useJUnitPlatform {
        includeTags 'high'
    }
    
    if (project.hasProperty('rebalancing.adapter')) {
        systemProperty 'rebalancing.adapter', project.property('rebalancing.adapter')
    }
    System.getProperties().each { key, value ->
        if (key.toString().startsWith('rebalancing.')) {
            systemProperty key.toString(), value.toString()
        }
    }
    
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

// Dedicated Regression Test suite (runs Medium and Low priority edge cases)
tasks.register('regressionTest', Test) {
    description = 'Runs medium and low priority boundary and edge test cases.'
    group = 'verification'
    
    useJUnitPlatform {
        includeTags 'medium', 'low'
    }
    
    if (project.hasProperty('rebalancing.adapter')) {
        systemProperty 'rebalancing.adapter', project.property('rebalancing.adapter')
    }
    System.getProperties().each { key, value ->
        if (key.toString().startsWith('rebalancing.')) {
            systemProperty key.toString(), value.toString()
        }
    }
    
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}
